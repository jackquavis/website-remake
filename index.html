<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | Jakub Chojnowski</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-root="" data-page="home">
  
  <header id="site-header" class="home-header">
    <a href="./" class="logo">JAKUB CHOJNOWSKI</a>
    
    <nav id="nav-menu"></nav>

    <div class="header-controls">
      <button class="hamburger" id="hamburger-btn" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="hero" id="hero-section">
    <div class="hero-bg" id="hero-bg"></div>
    <div class="hero-content">
      <h1 class="hero-title">Your New<br>Favorite Photo</h1>
      <p class="hero-subtitle">We'll get the shot you're going to want to use for everything.</p>
      <div class="hero-cta">
        <a href="booking/" class="btn btn-primary">Book a Shoot</a>
        <button id="reveal-gallery-btn" class="btn btn-outline">View Gallery</button>
      </div>
    </div>
  </div>
    
  <div class="gallery-section" id="gallery-section">
    <main>
      <div class="gallery" id="portfolio-gallery"></div>
    </main>
    <footer>
      <a href="https://instagram.com/jackquoob" class="social-icon" target="_blank" aria-label="Instagram">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
      </a>
      <p>© 2026 Jakub Chojnowski</p>
    </footer>
  </div>

  <div id="lightbox" class="lightbox">
    <span class="lightbox-close" id="lightbox-close">&times;</span>
    <button class="lightbox-prev" id="lightbox-prev">&#10094;</button>
    <img id="lightbox-img" class="lightbox-img" src="" alt="">
    <button class="lightbox-next" id="lightbox-next">&#10095;</button>
  </div>

  <script>
    const revealBtn = document.getElementById('reveal-gallery-btn');
    const siteHeader = document.getElementById('site-header');
    const gallerySection = document.getElementById('gallery-section');

    // Reveal Gallery Logic
    function unlockHomeGallery() {
      siteHeader.classList.add('visible');
      gallerySection.classList.add('visible');
    }

    revealBtn.addEventListener('click', () => {
      unlockHomeGallery();
      gallerySection.scrollIntoView({ behavior: 'smooth' });
    });

    // Only unlock automatically when arriving directly from another page (not on refresh or fresh visit)
    const navEntry = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    const isReload = navEntry ? navEntry.type === 'reload' : (performance.navigation && performance.navigation.type === 1);
    const params = new URLSearchParams(window.location.search);
    const hasHomeHash = window.location.hash === '#home' || window.location.hash === '#unlocked';
    let fromOtherPage = false;
    try {
      fromOtherPage = sessionStorage.getItem('homeUnlocked') === '1';
      sessionStorage.removeItem('homeUnlocked');
    } catch (e) {}

    if (params.has('unlocked') || hasHomeHash) {
      history.replaceState(null, '', window.location.pathname);
    }

    if (!isReload && (params.has('unlocked') || hasHomeHash || fromOtherPage)) {
      unlockHomeGallery();
      window.scrollTo(0, 0);
    } else if (isReload) {
      window.scrollTo(0, 0);
    }

    // Gallery & Lightbox Logic
    let galleryImages = []; let currentImageIndex = 0;
    const lightbox = document.getElementById('lightbox'), lightboxImg = document.getElementById('lightbox-img');
    const closeBtn = document.getElementById('lightbox-close'), prevBtn = document.getElementById('lightbox-prev'), nextBtn = document.getElementById('lightbox-next');

    // Setup scroll observer for gallery images (Fades in/out continuously)
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
        } else {
          entry.target.classList.remove('is-visible');
        }
      });
    }, { threshold: 0.1 });

    fetch('./data/gallery.json').then(res => res.json()).then(images => {
      galleryImages = images; 
      const gallery = document.getElementById('portfolio-gallery'); 
      const heroBg = document.getElementById('hero-bg'); 
      
      if (images.length > 0) {
        heroBg.style.backgroundImage = `url('${images[0].image}')`;
        Promise.resolve(window.Site ? Site.ready : null).then(site => {
          const y = images[0].offset_y != null ? images[0].offset_y : (site && site.hero_offset_y != null ? site.hero_offset_y : 22);
          const x = images[0].offset_x != null ? images[0].offset_x : (site && site.hero_offset_x != null ? site.hero_offset_x : 50);
          heroBg.style.backgroundPosition = `${x}% ${y}%`;
        });
      }
      
      images.slice(1).forEach((item, index) => {
        const img = document.createElement('img'); 
        img.src = item.image; 
        img.alt = item.alt;
        img.addEventListener('click', () => openLightbox(index + 1));
        gallery.appendChild(img);
        
        // Watch each image for scrolling
        observer.observe(img);
      });
    }).catch(err => console.error('Error loading gallery:', err));

    function openLightbox(idx) { currentImageIndex = idx; updateLightboxImage(); lightbox.classList.add('active'); document.body.style.overflow = 'hidden'; }
    function closeLightbox() { lightbox.classList.remove('active'); document.body.style.overflow = ''; }
    function updateLightboxImage() { lightboxImg.src = galleryImages[currentImageIndex].image; lightboxImg.alt = galleryImages[currentImageIndex].alt; }
    function showNext() { currentImageIndex = (currentImageIndex + 1) % galleryImages.length; updateLightboxImage(); }
    function showPrev() { currentImageIndex = (currentImageIndex - 1 + galleryImages.length) % galleryImages.length; updateLightboxImage(); }

    closeBtn.addEventListener('click', closeLightbox); nextBtn.addEventListener('click', showNext); prevBtn.addEventListener('click', showPrev);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'ArrowRight') showNext(); if (e.key === 'ArrowLeft') showPrev(); if (e.key === 'Escape') closeLightbox();
    });</script>
  <script src="assets/js/site.js"></script>
</body>
</html>
