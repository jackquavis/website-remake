<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links | Jakub Chojnowski</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* More obvious, rich water-like moving gradient */
      background: linear-gradient(-45deg, #0a0f1d, #1c2b59, #231236, #0a1128);
      background-size: 400% 400%;
      animation: fluidGradient 12s ease infinite;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1.5rem;
      text-align: center;
      position: relative;
    }

    /* Background Animation */
    @keyframes fluidGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Branding & Typography */
    .logo {
      position: absolute;
      top: 2.5rem;
      left: 0;
      width: 100%;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 6px;
      text-transform: uppercase;
      text-align: center;
    }

    /* Container for the main content */
    .links-wrapper {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      margin-top: 3rem;
    }

    .hero-title {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -1px;
      margin-bottom: 0.5rem;
    }

    .hero-subtitle {
      font-size: 1rem;
      color: #cccccc; /* Slightly brightened to contrast against the new background */
      margin-bottom: 2rem;
    }

    /* Button Group */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Button Styling */
    .btn {
      display: block;
      width: 100%;
      padding: 1.25rem;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .btn-primary {
      background-color: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
    }

    .btn-primary:hover {
      background-color: #e0e0e0;
      border-color: #e0e0e0;
    }

    .btn-secondary {
      background-color: transparent;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .btn-secondary:hover {
      border-color: #ffffff;
      background-color: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <div class="logo">JAKUB CHOJNOWSKI</div>

  <div class="links-wrapper">
    
    <div>
      <h1 class="hero-title">LET'S<br>CONNECT</h1>
      <p class="hero-subtitle">Access portfolio, booking, and socials.</p>
    </div>

    <div class="button-group">
      <!-- Primary Action -->
      <a href="contact/" class="btn btn-primary">Book a Shoot</a>
      
      <!-- Secondary Actions -->
      <a href="./" class="btn btn-secondary">View Portfolio</a>
      <a href="https://instagram.com/jackquoob" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">Instagram</a>
    </div>

  </div>

</body>
</html>
